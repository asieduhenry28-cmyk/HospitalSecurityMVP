<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6;}
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background: white;}
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; cursor: pointer; border-radius: 5px;}
        .back-btn { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #6c757d; }
        .flash { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; word-wrap: break-word; }
        .flash.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .flash.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Forgot Password</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <!-- The |safe filter allows the HTML link to render properly -->
                    <div class="flash {{ category }}">{{ message|safe }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <p>Enter your username to generate a secure password reset link.</p>
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>
            <button type="submit">Generate Reset Link</button>
        </form>
        <a href="/login" class="back-btn">Back to Login</a>
    </div>
</body>
</html>
