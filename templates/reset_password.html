<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6;}
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background: white;}
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;}
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Set New Password</h2>
        <form method="POST">
            <label>New Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Update Password</button>
        </form>
    </div>
</body>
</html>
