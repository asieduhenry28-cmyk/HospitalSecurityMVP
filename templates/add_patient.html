<!DOCTYPE html>
<html>
<head>
    <title>Register Patient</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input, select { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .back-btn { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007BFF; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Register New Patient</h2>
        <form method="POST" action="/add_patient">
            <label>Full Name:</label>
            <input type="text" name="full_name" required>

            <label>Date of Birth:</label>
            <input type="date" name="dob" required>

            <label>Gender:</label>
            <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Contact Number:</label>
            <input type="text" name="contact" required>

            <button type="submit">Save Patient</button>
        </form>
        <a href="/dashboard" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
