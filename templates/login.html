<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Security MVP</title>
        <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b1a30">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js');
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0b1a30 0%, #1a365d 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            padding: 40px; 
            width: 100%; 
            max-width: 450px; 
        }
        .logo-icon {
            font-size: 50px;
            color: #3b82f6;
            margin-bottom: 15px;
        }
        .form-control { 
            border-radius: 8px; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
        }
        .form-control:focus { 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); 
            border-color: #3b82f6; 
        }
        .btn-primary { 
            background-color: #3b82f6; 
            border: none; 
            border-radius: 8px; 
            padding: 12px; 
            font-weight: bold; 
            width: 100%;
            transition: 0.3s;
        }
        .btn-primary:hover { 
            background-color: #2563eb; 
            transform: translateY(-2px);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #64748b;
        }
        .form-control.with-icon {
            border-left: none;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <i class="fa-solid fa-hospital-user logo-icon"></i>
        <h3 class="fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted mb-4">Sign in to Hospital Security MVP</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} py-2" role="alert">
                        <small>{{ message|safe }}</small>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="text-start">
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control with-icon" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-muted small">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control with-icon" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mb-3">Login to Dashboard</button>
        </form>
        
        <div class="d-flex justify-content-between mt-3 small">
            <a href="/register" class="text-decoration-none text-primary fw-bold">Create an account</a>
            <a href="/forgot_password" class="text-decoration-none text-muted">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
