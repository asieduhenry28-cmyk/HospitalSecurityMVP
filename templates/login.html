<!DOCTYPE html>
<html>
<head>
    <title>Login - Hospital Security</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        .message { color: red; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Login</h2>
        
        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <p style="text-align: center;"><a href="/register">Don't have an account? Register</a></p>
                <p style="text-align: center; margin-top: 15px;">
            <a href="/forgot_password" style="color: #007BFF; text-decoration: none;">Forgot Password?</a>
        </p>
    </div>
</body>
</html>
