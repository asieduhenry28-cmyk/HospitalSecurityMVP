<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Security MVP</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
        }

        body { 
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars from floating shapes */
            position: relative;
        }

        /* Floating Background Shapes for a modern look */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }
        .shape-1 { width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -100px; animation: float 8s ease-in-out infinite; }
        .shape-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -50px; right: -50px; animation: float 10s ease-in-out infinite reverse; }
        .shape-3 { width: 200px; height: 200px; background: #10b981; top: 40%; left: 60%; animation: float 12s ease-in-out infinite; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
            100% { transform: translate(0, 0); }
        }

        /* The Glassmorphism/Modern Card */
        .login-card { 
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 440px; 
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 45px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group-text {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
            padding: 0 15px;
        }

        .form-control { 
            border: 2px solid #e2e8f0; 
            border-left: none;
            border-radius: 0 12px 12px 0;
            padding: 12px 15px; 
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus { 
            box-shadow: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Gradient Button */
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-color) 0%, #6366f1 100%);
            border: none; 
            border-radius: 12px; 
            padding: 14px; 
            font-weight: 600; 
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
            background: linear-gradient(135deg, var(--primary-hover) 0%, #4f46e5 100%);
        }

        .link-text {
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .link-text:hover { color: var(--primary-hover) !important; }

        .alert {
            border-radius: 12px;
            font-size: 0.85rem;
            border: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Floating Background Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-hospital-user logo-icon"></i>
            <h3 class="fw-bold mb-1" style="color: #1e293b;">Welcome Back</h3>
            <p class="text-muted" style="font-size: 0.9rem;">Sign in to Hospital Security MVP</p>
        </div>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} text-center" role="alert">
                        <i class="fa-solid {{ 'fa-check-circle' if category == 'success' else 'fa-exclamation-circle' }} me-2"></i>
                        {{ message|safe }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-4">
                <label class="form-label">Username</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mb-4">Login to Dashboard</button>
        </form>
        
        <div class="d-flex justify-content-between align-items-center mt-2">
            <a href="/register" class="text-decoration-none link-text text-primary">Create an account</a>
            <a href="/forgot_password" class="text-decoration-none link-text text-muted">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
