<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hospital Security MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0b1a30 0%, #1a365d 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .register-card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            padding: 40px; 
            width: 100%; 
            max-width: 500px; 
        }
        .logo-icon {
            font-size: 50px;
            color: #3b82f6;
            margin-bottom: 15px;
        }
        .form-control, .form-select { 
            border-radius: 8px; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
        }
        .form-control:focus, .form-select:focus { 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); 
            border-color: #3b82f6; 
        }
        .btn-success { 
            background-color: #10b981; 
            border: none; 
            border-radius: 8px; 
            padding: 12px; 
            font-weight: bold; 
            width: 100%;
            transition: 0.3s;
        }
        .btn-success:hover { 
            background-color: #059669; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="register-card text-center">
        <i class="fa-solid fa-user-plus logo-icon"></i>
        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted mb-4">Join the Hospital Management System</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} py-2" role="alert">
                        <small>{{ message }}</small>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register" class="text-start">
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="e.g. Dr. John Doe" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-muted small">System Role</label>
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>Select your role...</option>
                    <option value="receptionist">Receptionist</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success mb-3">Register Account</button>
        </form>
        
        <div class="mt-3 small">
            <span class="text-muted">Already have an account?</span>
            <a href="/login" class="text-decoration-none text-primary fw-bold ms-1">Sign In</a>
        </div>
    </div>

</body>
</html>
