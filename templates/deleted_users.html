<!DOCTYPE html>
<html>
<head>
    <title>Deleted Users Archive</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #343a40; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .back-btn { padding: 10px 15px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Deleted Users Archive</h1>
    <a href="/manage_users" class="back-btn">Back to User Management</a>
    
    <table>
        <thead>
            <tr>
                <th>Archive ID</th>
                <th>Original User ID</th>
                <th>Full Name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Deleted At</th>
                <th>Deleted By (User ID)</th>
            </tr>
        </thead>
        <tbody>
            {% for user in deleted %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>{{ user[3] }}</td>
                <td>{{ user[4] }}</td>
                <td>{{ user[5] }}</td>
                <td>{{ user[6] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
